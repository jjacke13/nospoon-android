name: F-Droid source-build rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Provision build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build make openjdk-21-jdk-headless
          ndk=$(python3 -c 'import json; print(json.load(open("fdroid/native-sources.json"))["ndk"])')
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$ndk"
      - name: Prepare and build JNI (same scripts as F-Droid)
        run: |
          scripts/prepare-native-sources.sh native/hyperdht
          ndk=$(python3 -c 'import json; print(json.load(open("fdroid/native-sources.json"))["ndk"])')
          scripts/build-jni-from-source.sh native/hyperdht native/libsodium native/libuv \
            "$ANDROID_HOME/ndk/$ndk" build/native-source app/src/main/jniLibs/arm64-v8a/libhyperdht_jni.so
      - name: Build unsigned release and test Kotlin
        run: |
          unset NOSPOON_KEYSTORE_PASSWORD NOSPOON_KEY_PASSWORD
          bash gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest assembleRelease
      - name: Check APK native payload and ZIP alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('app/build/outputs/apk/release/app-release-unsigned.apk') as apk:
              native = [n for n in apk.namelist() if n.startswith('lib/') and n.endswith('.so')]
              expected = 'lib/arm64-v8a/libhyperdht_jni.so'
              assert native == [expected], native
              assert apk.read(expected) == Path('app/src/main/jniLibs/arm64-v8a/libhyperdht_jni.so').read_bytes()
              assert not any(n.startswith('META-INF/') and n.endswith(('.RSA', '.DSA', '.EC')) for n in apk.namelist())
          PY
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release-unsigned.apk; then
            echo 'Expected an unsigned APK' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fdroid-source-rehearsal-arm64
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/src/main/jniLibs/arm64-v8a/libhyperdht_jni.so
            build/native-source/elf.txt
            fdroid/native-sources.json
